spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/line1thon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8001}

# 날씨 패턴(비 오는 날 소비): Open-Meteo 과거 날씨 API, 키 불필요. 일 강수량 1mm 이상이면 비 온 날.
weather:
  api:
    url: ${WEATHER_API_URL:https://archive-api.open-meteo.com/v1/archive}
  rain-threshold-mm: 1.0
